packages:
  - "desktop"

# These pins, and the shadcn-svelte preset they pull in, are younger than the default
# minimum-release-age window. Everything else keeps the guard.
minimumReleaseAgeExclude:
  - "@fontsource-variable/geist"
  - "@lucide/svelte"
  - "@sveltejs/kit"
  - "cn"
  - shadcn-svelte
  - "tailwind-variants"
  - "tw-animate-css"
