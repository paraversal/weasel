<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Before-paint theme: the backend setting is authoritative, this cache only
			// prevents a light flash on dark-theme launches.
			(() => {
				try {
					const stored = localStorage.getItem('weasel.theme');
					const dark =
						stored === 'dark' ||
						((stored === null || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch {
					// localStorage unavailable: keep the light default.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
