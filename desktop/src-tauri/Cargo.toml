[package]
name = "weasel-desktop"
description = "Weasel desktop shell: Tauri adapter, runtime composition and IPC surface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "weasel"

[lib]
name = "weasel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "weasel"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
weasel-core.workspace = true
weasel-store.workspace = true
weasel-platform.workspace = true

async-trait.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

tauri = "2.12.5"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-specta = { version = "2.0.0-rc.28", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "0.0.15"

[dev-dependencies]
tempfile.workspace = true
weasel-testkit.workspace = true
