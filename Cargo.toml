[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/paraversal/weasel"
publish = false

[workspace.dependencies]
weasel-core = { path = "crates/weasel-core" }
weasel-store = { path = "crates/weasel-store" }
weasel-import = { path = "crates/weasel-import" }
weasel-platform = { path = "crates/weasel-platform" }
weasel-testkit = { path = "crates/weasel-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "json",
] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.dev.package.sqlx-macros]
opt-level = 3
